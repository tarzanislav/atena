<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ATENA: a calm tile in the section colours, with an A that is also an open book -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b8fd6"/>
      <stop offset="1" stop-color="#a48ad6"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- the A -->
    <path d="M300 760 L512 250 L724 760" stroke-width="92"/>
    <!-- its bar: the pages of an open book -->
    <path d="M392 600 Q452 566 512 600 Q572 566 632 600" stroke-width="58"/>
  </g>
</svg>
