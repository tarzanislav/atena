[package]
name = "atena-desktop"
description = "ATENA for one computer: the window around atena-app"
version = "0.2.3"
edition = "2024"
# Tauri 2.12 needs Rust 1.90
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/tarzanislav/atena"
authors = ["The ATENA contributors"]
publish = false

# The window needs the system's web view (WebView2 on Windows, WebKitGTK on Linux), so it is built
# apart from the core workspace, which builds and tests without one.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false }

[dependencies]
atena-app = { path = "../../../crates/atena-app" }
atena-extract = { path = "../../../crates/atena-extract" }
# counts allocations so that the parsing worker can be held to a memory limit
cap = "0.1.2"
# opens the original of a document in the user's own browser
open = "5.4.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# the key derivation of the private account must be fast enough in debug builds too
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
