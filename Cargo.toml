[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/tarzanislav/atena"
authors = ["The ATENA contributors"]
# ATENA is an application; its crates are not published to crates.io
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# the key derivation must be fast enough in tests and debug builds too
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
