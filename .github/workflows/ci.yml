name: samotest
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: atena_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
        working-directory: prototyp-v0.1
      - name: Testy (vrátane databázových a koniec-koncov)
        env: {ATENA_TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/atena_test"}
        run: pytest -q
        working-directory: prototyp-v0.1
      - name: Docker obraz sa dá zostaviť
        run: docker build -t atena:ci prototyp-v0.1
