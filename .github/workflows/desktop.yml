name: Desktop app

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "data/**"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "data/**"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # PostgreSQL inside the app: the official Windows binaries of EnterpriseDB, linked from
  # https://www.postgresql.org/download/windows/. The checksum pins exactly this archive; when it is
  # empty, the build reports the checksum it found and stops, so that a person pins it.
  PG_VERSION: "17.11"
  PG_URL: "https://sbp.enterprisedb.com/getfile.jsp?fileid=1260616"
  # 381,531,864 bytes; pinned on 24 Oct 2026 after two downloads gave the same archive
  PG_SHA256: "80379b2c04d51c30225532e0ae04509899141e9957ed096fe749d7fd9df8f82f"

# Actions are pinned to full commit SHAs so a moved tag cannot change what runs here.

jobs:
  window:
    name: Interface and window (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Interface (types, languages, build)
        run: |
          npm ci
          npm run build
      - name: System libraries of the web view
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --message-format=short -- -D warnings 2>&1 \
            | sed -E -e 's#^([^: ]+):([0-9]+):([0-9]+): (error|warning)(\[[^]]*\])?: (.*)$#::error file=apps/desktop/src-tauri/\1,line=\2,col=\3::\6 \5#' \
                     -e 's/^(error.*)$/::error::\1/'

  licences:
    name: Licences and advisories of the window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: PostgreSQL programs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:PG_URL -OutFile pg.zip
          $size = (Get-Item pg.zip).Length
          $head = Get-Content pg.zip -AsByteStream -TotalCount 2
          if ($head[0] -ne 0x50 -or $head[1] -ne 0x4B) {
            Write-Output "::error::the PostgreSQL download is not a zip archive ($size bytes)"
            exit 1
          }
          $sha = (Get-FileHash pg.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $env:PG_SHA256) {
            $names = (Expand-Archive pg.zip -DestinationPath pg -PassThru | Select-Object -First 5 | ForEach-Object FullName) -join ", "
            Write-Output "::error::PostgreSQL $env:PG_VERSION archive: $size bytes, SHA-256 $sha, first entries: $names – check it and pin it as PG_SHA256"
            exit 1
          }
          if ($sha -ne $env:PG_SHA256) {
            Write-Output "::error::PostgreSQL archive SHA-256 $sha differs from the pinned $env:PG_SHA256"
            exit 1
          }
          # only what the app needs (not pgAdmin, StackBuilder, headers or documentation)
          New-Item -ItemType Directory -Force pg | Out-Null
          tar -xf pg.zip -C pg pgsql/bin pgsql/lib pgsql/share pgsql/commandlinetools_3rd_party_licenses.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $from = "pg/pgsql"
          $to = "apps/desktop/src-tauri/resources/postgres"
          New-Item -ItemType Directory -Force "$to/bin", "$to/lib" | Out-Null
          # the three programs the app runs, the modules of PostgreSQL, and exactly the libraries
          # they load (read from their import tables) – not the ones of pgAdmin or StackBuilder
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $queue = [System.Collections.Generic.Queue[string]]::new()
          foreach ($program in "initdb.exe", "pg_ctl.exe", "postgres.exe") {
            Copy-Item "$from/bin/$program" "$to/bin/"
            $queue.Enqueue((Resolve-Path "$from/bin/$program").Path)
          }
          foreach ($module in Get-ChildItem "$from/lib" -Filter *.dll) {
            Copy-Item $module.FullName "$to/lib/"
            $queue.Enqueue($module.FullName)
          }
          $needed = @{}
          $elsewhere = @{}
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            foreach ($line in & $dumpbin /nologo /dependents $file) {
              if (-not ($line -match '^\s+(\S+\.dll)\s*$')) { continue }
              $name = $Matches[1].ToLower()
              $path = Join-Path "$from/bin" $Matches[1]
              if (Test-Path $path) {
                if (-not $needed.ContainsKey($name)) { $needed[$name] = $path; $queue.Enqueue((Resolve-Path $path).Path) }
              } else {
                $elsewhere[$name] = $true
              }
            }
          }
          foreach ($path in $needed.Values) { Copy-Item $path "$to/bin/" }
          # the C++ runtime is not part of every Windows: it comes with the app (as Microsoft allows)
          foreach ($runtime in $elsewhere.Keys | Where-Object { $_ -match '^(vcruntime140(_1)?|msvcp140(_\w+)?|concrt140)\.dll$' }) {
            $source = & $vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\$runtime" | Select-Object -First 1
            if (-not $source) { Write-Output "::error::$runtime not found"; exit 1 }
            Copy-Item $source "$to/bin/"
          }
          $outside = ($elsewhere.Keys | Sort-Object) -join ", "
          Write-Output "::notice::loaded from Windows or not needed by the app: $outside"
          Copy-Item "$from/share" $to -Recurse
          Remove-Item "$to/share/doc" -Recurse -ErrorAction SilentlyContinue
          # the licences of the libraries, as EnterpriseDB ships them with the programs
          New-Item -ItemType Directory -Force "apps/desktop/src-tauri/resources/notices" | Out-Null
          Copy-Item "$from/commandlinetools_3rd_party_licenses.txt" "apps/desktop/src-tauri/resources/notices/postgresql-libraries-edb.txt"
          $libraries = (Get-ChildItem "$to/bin" -Filter *.dll | ForEach-Object Name) -join ", "
          Write-Output "::notice::PostgreSQL $env:PG_VERSION libraries: $libraries"
          & "$to/bin/postgres.exe" --version

      - name: The database inside the app with exactly these programs
        timeout-minutes: 30
        shell: pwsh
        run: |
          $env:ATENA_TEST_PG_BIN = (Resolve-Path apps/desktop/src-tauri/resources/postgres/bin).Path
          cargo test -p atena-app --test postgres --locked

      - name: Interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Licence texts
        working-directory: apps/desktop
        run: |
          node scripts/notices.mjs --target x86_64-pc-windows-msvc
          node scripts/postgres-notices.mjs src-tauri/resources/postgres

      - name: Installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atena-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
