[package]
name = "atena-vault"
description = "ATENA's private part: a local account whose key encrypts the user's private data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
keyring-core = "1.0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = "1.9.1"

# the persistent sign-in keeps the key in the Windows Credential Manager (protected by DPAPI)
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[lints]
workspace = true
