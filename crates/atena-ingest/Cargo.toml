[package]
name = "atena-ingest"
description = "ATENA ingestion: scheduler and pipeline from the source register to versions and classification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "atena-ingest"
path = "src/main.rs"

[dependencies]
atena-assess = { path = "../atena-assess" }
atena-core = { path = "../atena-core" }
atena-crawl = { path = "../atena-crawl" }
atena-extract = { path = "../atena-extract" }
atena-search = { path = "../atena-search" }
atena-store = { path = "../atena-store" }
# counts allocations so that the parsing worker can be held to a memory limit
cap = "0.1.2"
jiff = "0.2.38"
# the public suffix list: which hosts belong to one site (static.minedu.sk and www.minedu.sk do,
# two hosts under gov.uk do not)
psl = "2.1.245"
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
atena-crawl = { path = "../atena-crawl", features = ["testing"] }
atena-store = { path = "../atena-store", features = ["testing"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
