[package]
name = "atena-crawl"
description = "ATENA crawler: polite and safe fetching, robots.txt (RFC 9309), TDMRep, feeds and sitemaps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.10"
jiff = "0.2.38"
quick-xml = "0.42.0"
# No default features: no system proxy (it would bypass the address checks) and no aws-lc
# (its OpenSSL licence is outside our policy); TLS uses rustls with the ring provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
url = "2.5.8"

[features]
# test support for this and other crates: a local HTTP server and matching fetcher settings
testing = ["tokio/io-util", "tokio/rt"]

[dev-dependencies]
atena-crawl = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "test-util"] }

[lints]
workspace = true
