[package]
name = "atena-store"
description = "ATENA storage: PostgreSQL schema and queries, content-addressed file store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
jiff = "0.2.38"
jiff-sqlx = { version = "0.1.1", features = ["postgres"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror.workspace = true

[features]
# test support for this and other crates: a temporary database per test
testing = []

[dev-dependencies]
atena-store = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[lints]
workspace = true
