schemes:
  section:
    labels:
      sk: Sekcie
      en: Sections
      cs: Sekce
      ru: Разделы
      zh: 栏目
    note:
      sk: Sekcie sú vstupné brány podľa toho, ČO používateľ potrebuje urobiť. Obsah nie je uväznený v jednej sekcii – každá položka môže byť vo
        viacerých cez fazety (téma, druh školy, typ obsahu…). Pole includes vymenúva pojmy iných osí (alebo celé osi), ktoré sekcia zahŕňa;
        kľúčové slová má sekcia len tam, kde jej obsah žiadna iná os nepokrýva.
      en: Sections are entry gates by what the user needs to do. A document belongs to every section whose members it is labelled with –
        `includes` lists the concepts of other schemes (or whole schemes) a section gathers; a section has keywords of its own only where
        no other scheme covers its content.
