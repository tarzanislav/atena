# ATENA – riadený viacjazyčný slovník (taxonómia) v štýle SKOS
# ---------------------------------------------------------------
# Každá schéma (scheme) je samostatná OS (fazeta). Pojmy (concepts) majú:
#   id        – trvalý identifikátor (nikdy sa nemení, len sa označí ako zastaraný)
#   sk / en   – preferované označenie (ďalšie jazyky v "labels")
#   broader   – nadradený pojem v rámci tej istej schémy
#   kw        – kľúčové výrazy podľa jazyka na automatický NÁVRH zaradenia
#               (začiatok slova stačí: "čitateľsk" zachytí čitateľská/čitateľskej…)
#   note      – redakčná poznámka / definícia (vždy so zdrojom v module Pojmy)
# Automatické zaradenie je vždy len návrh so stavom "auto" – potvrdzuje ho redaktor.
# Licencia tohto súboru: CC BY 4.0 (dáta projektu ATENA).

version: 1
languages: [sk, cs, en, de, pl, hu, ru, zh]

