# What ATENA looks for when it reads terms of use, legal notices and licence statements.
# Licence: CC0 1.0. Add a language by adding its phrases; no change to the program is needed.
#
# Matching: text is lower-cased and normalised (NFKC); a phrase must start at the beginning of a
# word but may end inside one ("zakázan" matches "zakázané"); phrases of up to three letters must
# match whole words. Phrases in scripts without spaces (Chinese, Japanese) match anywhere.
#
# A finding of `automation` needs a subject and a prohibition marker in the same sentence; a
# finding of `mining` needs a subject and a prohibition or reservation marker. The other
# categories are single phrases. False alarms only make the proposal stricter, and a person
# confirms every proposal.
version: 1

# Words in link texts or addresses that lead to terms of use, legal notices and licences.
legal_links:
  en: [terms, conditions of use, legal, copyright, disclaimer, imprint, licence, license, licensing, permissions, reuse, re-use, rights and permissions]
  sk: [podmienky, autorské, autorske, právne, pravne, licenci, impresum, ochrana obsahu]
  cs: [podmínky, podminky, autorská, autorska, právní, pravni, licenc]
  de: [impressum, nutzungsbedingung, agb, urheberrecht, rechtliche, rechtlicher, haftungsausschluss, lizenz]
  fr: [mentions légales, mentions-legales, conditions générales, conditions d'utilisation, cgu, droits d'auteur, informations légales]
  pl: [regulamin, warunki korzystania, prawa autorskie, nota prawna, licencj, zastrzeżenia prawne]
  hu: [impresszum, jogi nyilatkozat, felhasználási feltételek, szerzői jog, licenc]
  ru: [пользовательское соглашение, условия использования, правовая информация, авторск, правила использования, лиценз]
  zh: [使用条款, 版权, 网站声明, 法律声明, 用户协议]
  nl: [gebruiksvoorwaarden, voorwaarden, auteursrecht, colofon, licentie]
  it: [note legali, condizioni d'uso, termini, diritto d'autore, licenza]
  es: [aviso legal, términos, condiciones de uso, derechos de autor, licencia]
  sv: [upphovsrätt, användarvillkor, villkor, om webbplatsen, licens]
  fi: [käyttöehdot, tekijänoikeu, lisenssi]
  et: [kasutustingimused, autoriõigus, litsents]
  ja: [利用規約, 著作権, サイトポリシー, 免責]

# Links that are never about content rights: privacy, cookies, accessibility, accounts.
ignore_links: [privacy, cookie, gdpr, datenschutz, ochrana osobn, ochrany osobn, osobných údajov, osobních údajů, ochrana súkromia, rodo, prywatno, adatkezel, adatvédelm, конфиденциальн, персональн, 隐私, privacidad, confidentialité, données personnelles, integritet, tietosuoja, privacyverklaring, accessib, prístupnost, přístupnost, barrierefrei, dostępnoś, akadálymentes, login, log in, sign in, prihlás, přihlás, anmeld, newsletter]

# Words that make a block of an ordinary page worth reading as a legal statement (footers).
legal_context: ["©", "(c)", copyright, all rights, licen, terms, podmienk, podmínk, autorsk, práva, urheber, rechte, droits, prawa, jog, права, 版权, voorwaarden, diritti, derechos, rättigheter, oikeudet, õigused, 著作権]

