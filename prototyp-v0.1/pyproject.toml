[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atena"
version = "0.1.0"
description = "ATENA – otvorený agregátor overených informácií o vzdelávaní"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "tarzanislav a prispievatelia ATENA" }]
# Všetky závislosti majú permisívne licencie (MIT/BSD/Apache-2.0) – bez poplatkov
# pre súkromné aj komerčné použitie. Kontroluje to tests/test_licenses.py.
dependencies = [
  "fastapi>=0.115",          # MIT
  "uvicorn>=0.30",           # BSD-3
  "jinja2>=3.1",             # BSD-3
  "python-multipart>=0.0.9", # Apache-2.0
  "httpx>=0.27",             # BSD-3
  "psycopg[binary]>=3.2",    # LGPL-3 (len knižnica, bez úprav – povolené aj komerčne)
  "pyyaml>=6.0",             # MIT
  "defusedxml>=0.7",         # PSF
  "feedparser>=6.0",         # BSD-2
  "trafilatura>=2.0",        # Apache-2.0 (od verzie 1.8)
  "pypdf>=4.0",              # BSD-3
  "python-docx>=1.1",        # MIT
  "py3langid>=0.3",          # BSD-3
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atena = "atena.cli:main"

[tool.setuptools.packages.find]
include = ["atena*"]

[tool.setuptools.package-data]
atena = ["data/*.yaml", "db/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
