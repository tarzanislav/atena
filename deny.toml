# cargo-deny: licences, advisories, bans and sources.
# Policy: only licences that allow private and commercial use without fees.
# No AGPL, GPL, SSPL or non-commercial licences.

[graph]
all-features = true
# Platforms ATENA ships to (server, desktop and mobile apps); wasm32 is not one of them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "aarch64-apple-ios",
]

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser (unmaintained) comes with lopdf, but only lopdf's FontData / add_font use it –
    # code for creating PDFs with embedded fonts. ATENA only reads PDFs and never calls it.
    # Remove when pdf-extract moves to a lopdf without ttf-parser, or when PDFium replaces it.
    { id = "RUSTSEC-2026-0192", reason = "only reachable when writing PDFs; ATENA only reads them" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
